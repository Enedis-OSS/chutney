<div class="row justify-content-center">
  <div class="btn-group btn-group-sm w-25">
    <button
      class="btn btn-sm btn-info rounded mb-2"
      title="{{'global.actions.help' | translate}}"
      (click)="help = !help"
      >
      {{'global.actions.help' | translate}}
      <span class="fa fa-info"></span>
    </button>
  </div>
</div>
@if (help) {
  <div class="text-white bg-info rounded p-3 mb-2">
    <p>{{'admin.agents.help.why' | translate}}</p>
    <p class="mb-0">{{'admin.agents.help.how' | translate}}</p>
  </div>
}
<div class="row">
  <div class="col-sm-3">
    @if (description) {
      <chutney-agent-network-configuration [currentConfiguration]="description.networkConfiguration" (configurationUpdate)="propagationDone($event)"></chutney-agent-network-configuration>
    }
  </div>
  <div class="col-sm-9">
    @if (description) {
      <chutney-network-graph [agentGraphe]="description.graphe" [message]="messages"></chutney-network-graph>
    }
  </div>
</div>
